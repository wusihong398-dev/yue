name: 自动编译并生成安卓APK (Build Android APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: 编译打包 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码 (Checkout Repository)
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境 (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 配置 Java JDK 21 (Setup Java JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 安装项目依赖 (Install Dependencies)
        run: npm install --legacy-peer-deps

      - name: 编译生产前端工程 (Build Web Assets)
        run: npm run build

      - name: 接受 Android SDK 协议许可 (Accept Android Licenses)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 初始化 Capacitor 并同步 Android 原生工程
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap sync android

      - name: 执行 Gradle 编译安卓 APK (Build Debug APK)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 安装包至 GitHub 产物 (Upload APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: 约在一起-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
